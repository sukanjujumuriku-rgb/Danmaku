<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>弾幕ゲーム</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
}
canvas{
    display:block;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const keys = {};
const bullets = [];

let frame = 0;

const player = {
    x: canvas.width/2,
    y: canvas.height-120,
    speed:5,
    radius:4
};

const enemy = {
    x: canvas.width/2,
    y:120,
    hp:1000,
    maxHp:1000
};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

class Bullet{

    constructor(x,y,vx,vy,type="normal"){

        this.x=x;
        this.y=y;

        this.vx=vx;
        this.vy=vy;

        this.type=type;

        this.radius=8;

        this.life=0;

        this.exploded=false;
    }

    update(){

        this.life++;

        this.x += this.vx;
        this.y += this.vy;

        if(this.type==="bounce"){

            if(this.x < this.radius){
                this.x=this.radius;
                this.vx*=-1;
            }

            if(this.x > canvas.width-this.radius){
                this.x=canvas.width-this.radius;
                this.vx*=-1;
            }

            if(this.y < this.radius){
                this.y=this.radius;
                this.vy*=-1;
            }

            if(this.y > canvas.height-this.radius){
                this.y=canvas.height-this.radius;
                this.vy*=-1;
            }
        }

        if(
            this.type==="explode" &&
            this.life>60 &&
            !this.exploded
        ){

            this.exploded=true;

            for(let i=0;i<12;i++){

                const angle=(Math.PI*2/12)*i;

                bullets.push(
                    new Bullet(
                        this.x,
                        this.y,
                        Math.cos(angle)*4,
                        Math.sin(angle)*4
                    )
                );
            }
        }
    }

    draw(){

        let color="#ff9933";

        if(this.type==="explode")
            color="#44aaff";

        if(this.type==="bounce")
            color="#44ff88";

        ctx.beginPath();
        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI*2
        );
        ctx.fillStyle=color;
        ctx.fill();
    }

    remove(){

        if(this.type==="bounce")
            return false;

        return(
            this.x<-100 ||
            this.x>canvas.width+100 ||
            this.y<-100 ||
            this.y>canvas.height+100 ||
            this.life>600
        );
    }
}

function aimedVector(speed){

    const dx=player.x-enemy.x;
    const dy=player.y-enemy.y;

    const len=Math.hypot(dx,dy);

    return{
        vx:dx/len*speed,
        vy:dy/len*speed
    };
}

function pattern1(){

    for(let i=0;i<5;i++){

        setTimeout(()=>{

            const v=aimedVector(5);

            bullets.push(
                new Bullet(
                    enemy.x,
                    enemy.y,
                    v.vx,
                    v.vy
                )
            );

        },i*150);

    }
}

function pattern2(){

    for(let i=0;i<3;i++){

        setTimeout(()=>{

            const v=aimedVector(4);

            bullets.push(
                new Bullet(
                    enemy.x,
                    enemy.y,
                    v.vx,
                    v.vy,
                    "explode"
                )
            );

        },i*250);

    }
}

function pattern3(){

    for(let i=0;i<3;i++){

        setTimeout(()=>{

            const center=Math.atan2(
                player.y-enemy.y,
                player.x-enemy.x
            );

            for(let j=-3;j<=2;j++){

                const angle=center+j*0.22;

                bullets.push(
                    new Bullet(
                        enemy.x,
                        enemy.y,
                        Math.cos(angle)*5,
                        Math.sin(angle)*5,
                        "bounce"
                    )
                );
            }

        },i*250);

    }
}

function enemyAttack(){

    if(frame%360===0)
        pattern1();

    if(frame%720===0)
        pattern2();

    if(frame%1080===0)
        pattern3();
}

function updatePlayer(){

    if(keys["a"])
        player.x-=player.speed;

    if(keys["d"])
        player.x+=player.speed;

    if(keys["w"])
        player.y-=player.speed;

    if(keys["s"])
        player.y+=player.speed;

    player.x=Math.max(
        20,
        Math.min(canvas.width-20,player.x)
    );

    player.y=Math.max(
        20,
        Math.min(canvas.height-20,player.y)
    );
}

function updateBullets(){

    for(const bullet of bullets){
        bullet.update();
    }

    for(let i=bullets.length-1;i>=0;i--){

        if(bullets[i].remove()){
            bullets.splice(i,1);
        }
    }
}

function drawBackground(){

    ctx.fillStyle="#000";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

function drawEnemy(){

    ctx.beginPath();
    ctx.arc(
        enemy.x,
        enemy.y,
        30,
        0,
        Math.PI*2
    );
    ctx.fillStyle="#ff4444";
    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(
        enemy.x-10,
        enemy.y-5,
        4,
        0,
        Math.PI*2
    );
    ctx.arc(
        enemy.x+10,
        enemy.y-5,
        4,
        0,
        Math.PI*2
    );
    ctx.fillStyle="#fff";
    ctx.fill();

    ctx.fillStyle="#333";
    ctx.fillRect(
        enemy.x-60,
        enemy.y-55,
        120,
        10
    );

    ctx.fillStyle="#00ff00";
    ctx.fillRect(
        enemy.x-60,
        enemy.y-55,
        120*(enemy.hp/enemy.maxHp),
        10
    );
}

function drawPlayer(){

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        20,
        0,
        Math.PI*2
    );
    ctx.fillStyle="#4488ff";
    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI*2
    );
    ctx.fillStyle="#fff";
    ctx.fill();
}

function drawBullets(){

    for(const bullet of bullets){
        bullet.draw();
    }
}

function drawInfo(){

    ctx.fillStyle="#fff";
    ctx.font="18px sans-serif";

    ctx.fillText(
        "WASDで移動",
        20,
        30
    );

    ctx.fillText(
        "弾数 : "+bullets.length,
        20,
        60
    );
}

function loop(){

    frame++;

    updatePlayer();

    enemyAttack();

    updateBullets();

    drawBackground();

    drawEnemy();

    drawBullets();

    drawPlayer();

    drawInfo();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
