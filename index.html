<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Silfrain Beta</title>

<style>
body{
    margin:0;
    background:#111;
    overflow:hidden;
}

canvas{
    display:block;
    margin:auto;
    background:#000;
    border:2px solid white;
}
</style>

</head>
<body>

<canvas id="game" width="800" height="600"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const keys = {};

document.addEventListener("keydown", e=>{
    keys[e.code]=true;
});

document.addEventListener("keyup", e=>{
    keys[e.code]=false;
});

const player = {
    x:400,
    y:500,
    speed:4,
    radius:10,
    hp:3,
    invincible:0
};

const boss = {
    x:400,
    y:100,
    radius:25,
    hp:1000,
    dir:1
};

const bullets = [];
const enemyBullets = [];

let chargeStart = null;

function spawnPlayerBullet(power){

    bullets.push({
        x:player.x,
        y:player.y,
        speed:8,
        power:power,
        radius: power===10 ? 8 : 4
    });
}

function updatePlayer(){

    if(keys["KeyW"]) player.y -= player.speed;
    if(keys["KeyS"]) player.y += player.speed;
    if(keys["KeyA"]) player.x -= player.speed;
    if(keys["KeyD"]) player.x += player.speed;

    player.x = Math.max(0,Math.min(canvas.width,player.x));
    player.y = Math.max(0,Math.min(canvas.height,player.y));

    if(player.invincible > 0){
        player.invincible--;
    }

    if(keys["Space"] && chargeStart === null){
        chargeStart = performance.now();
    }

    if(!keys["Space"] && chargeStart !== null){

        const held =
            (performance.now() - chargeStart) / 1000;

        if(held >= 1){
            spawnPlayerBullet(10);
        }else{
            spawnPlayerBullet(5);
        }

        chargeStart = null;
    }
}

function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        const b = bullets[i];

        b.y -= b.speed;

        const dx = b.x - boss.x;
        const dy = b.y - boss.y;

        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < boss.radius + b.radius){

            boss.hp -= b.power;

            bullets.splice(i,1);
            continue;
        }

        if(b.y < -20){
            bullets.splice(i,1);
        }
    }
}

let enemyTimer = 0;

function updateBoss(){

    boss.x += boss.dir * 2;

    if(boss.x > 700) boss.dir = -1;
    if(boss.x < 100) boss.dir = 1;

    enemyTimer++;

    if(enemyTimer > 30){

        enemyTimer = 0;

        const count = 8;

        for(let i=0;i<count;i++){

            const angle =
                (Math.PI * 2 / count) * i;

            enemyBullets.push({
                x:boss.x,
                y:boss.y,
                vx:Math.cos(angle) * 2,
                vy:Math.sin(angle) * 2,
                radius:5
            });
        }
    }
}

function updateEnemyBullets(){

    for(let i=enemyBullets.length-1;i>=0;i--){

        const b = enemyBullets[i];

        b.x += b.vx;
        b.y += b.vy;

        const dx = b.x - player.x;
        const dy = b.y - player.y;

        const dist = Math.sqrt(dx*dx + dy*dy);

        if(
            dist < player.radius + b.radius &&
            player.invincible <= 0
        ){

            player.hp--;
            player.invincible = 60;

            enemyBullets.splice(i,1);

            if(player.hp <= 0){

                alert("GAME OVER");
                location.reload();
                return;
            }

            continue;
        }

        if(
            b.x < -20 ||
            b.x > canvas.width + 20 ||
            b.y < -20 ||
            b.y > canvas.height + 20
        ){
            enemyBullets.splice(i,1);
        }
    }
}

function drawPlayer(){

    if(
        player.invincible > 0 &&
        Math.floor(player.invincible/5)%2===0
    ){
        return;
    }

    ctx.fillStyle = "cyan";

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI*2
    );
    ctx.fill();
}

function drawBoss(){

    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(
        boss.x,
        boss.y,
        boss.radius,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle = "red";
    ctx.fillRect(250,20,300,20);

    ctx.fillStyle = "lime";
    ctx.fillRect(
        250,
        20,
        300 * (boss.hp / 1000),
        20
    );

    ctx.fillStyle = "white";
    ctx.font = "20px sans-serif";
    ctx.fillText("シルフレイン",330,60);
}

function drawBullets(){

    ctx.fillStyle = "yellow";

    bullets.forEach(b=>{

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    });
}

function drawEnemyBullets(){

    ctx.fillStyle = "orange";

    enemyBullets.forEach(b=>{

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    });
}

function drawChargeBar(){

    if(chargeStart === null) return;

    const held = Math.min(
        (performance.now() - chargeStart)/1000,
        1
    );

    ctx.fillStyle = "white";
    ctx.fillRect(20,560,200,20);

    ctx.fillStyle = "cyan";
    ctx.fillRect(
        20,
        560,
        200 * held,
        20
    );
}

function drawPlayerHP(){

    ctx.fillStyle = "white";
    ctx.font = "24px sans-serif";

    ctx.fillText(
        "HP : " + player.hp,
        20,
        40
    );
}

function drawVictory(){

    ctx.fillStyle = "white";
    ctx.font = "48px sans-serif";

    ctx.fillText(
        "VICTORY",
        290,
        300
    );
}

function gameLoop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    updatePlayer();
    updateBoss();
    updateBullets();
    updateEnemyBullets();

    drawPlayer();
    drawBoss();
    drawBullets();
    drawEnemyBullets();
    drawChargeBar();
    drawPlayerHP();

    if(boss.hp > 0){
        requestAnimationFrame(gameLoop);
    }else{
        drawVictory();
    }
}

gameLoop();

</script>

</body>
</html>
